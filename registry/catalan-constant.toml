repo = "slitsey/catalan-irrationality-measure"
kind = "external"
owners = ["slitsey"]
tags = ["lean", "number-theory", "irrationality"]
listed = true
added = "2026-10-08"
contributors_override = 4
attempts_override = 54
discussion_url = "https://github.com/slitsey/catalan-irrationality-measure/issues"

[spec]
title = "Catalan’s constant"
summary = "The quantity is an upper bound on the irrationality exponent \\mu(G) of Catalan’s constant. A lower bound is better. The release states irrationality but gives no finite exponent bound; the baseline is the trivial extended-real upper bound +\\infty."
metric = { name = "\\mu(G)", unit = "", direction = "min", scale = "linear", display = "\\mu(G) \\le {value}" }
verifier = { type = "lean" }
submit = "Open a Pull Request to slitsey/catalan-irrationality-measure and register new records in superautoresearch/hub."
rules_url = "https://github.com/slitsey/catalan-irrationality-measure#readme"
baseline = { value = 740.0, label = "Initial effective irrationality measure mu(G) <= 740", source = "https://github.com/openai/math/blob/adc7f1241b42e322a6451854ab7e4b4c146bf78a/preprints/Catalans-constant-is-irrational-September-24-2026/paper.pdf" }
tracks = [{ id = "bound-tightening", title = "Tighten Catalan’s constant bound beyond 590.0" }, { id = "lean-formalization", title = "Formalize current frontier bound for Catalan’s constant in Lean 4" }]

[spec.records_source]
type = "hub"
