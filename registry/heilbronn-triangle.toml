title = "Heilbronn triangle"
summary = "The quantity is the saving \\eta in \\Delta(n)\\ge cn^{-2+\\eta}. A higher saving is better. The baseline is \\eta=2/(45435k+16), where k=T^2+1 and T=\\binom{\\binom{163}{41}}{3}; the displayed approximation comes from the follow-up. Each claim assumes estimates from the manuscript and states them, with its proof scope."
metric = { name = "\\eta in \\Delta(n)\\ge cn^{-2+\\eta", unit = "", direction = "max", scale = "linear", display = "\\eta = {value}" }
